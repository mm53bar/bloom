# Invented pots — see locations.yml.

fern:
  spot: sunroom_sill
  name: Big Fern
  voice_aliases: [ "the big fern", "sunroom fern" ]
  medium: soil
  dry_below: 30
  wet_above: 80
  water_interval_days: 7
  fertilize_interval_days: 30
  check_interval_days: 7
  position: 1

# The shared-container case: one soil volume, one reading, one watering
# decision, several plants living in it.
succulent_bowl:
  spot: sunroom_sill
  name: Succulent Bowl
  voice_aliases: [ "the succulents" ]
  medium: soil
  dry_below: 15
  wet_above: 95
  water_interval_days: 21
  check_interval_days: 14
  position: 2

# Semi-hydro: thresholds exist but are not what decides watering.
pothos:
  spot: landing_shelf
  name: Clay Ball Pothos
  medium: semi_hydro
  dry_below: 20
  wet_above: 100
  water_interval_days: 14
  fertilize_interval_days: 30
  check_interval_days: 14
  position: 1

# Deliberately under-lit: a bright-light plant parked in a dark cellar, so the
# light-mismatch report has something to find.
orphan:
  spot: cellar_bench
  name: Forgotten Pot
  medium: soil
  dry_below: 25
  wet_above: 90
  check_interval_days: 7
  position: 1
